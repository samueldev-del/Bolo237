name: Admin Security E2E CI

on:
  workflow_dispatch:
  # Pas de filtre de chemins : un check requis qui ne s'exécute pas ne
  # reporte jamais de statut, et la pull request reste bloquée sans cause
  # visible. Les minutes Actions sont illimitées sur un dépôt public, et
  # les trois workflows tournent en parallèle en moins de trois minutes.
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  # Groupe distinct de celui du frontend : deux workflows partageant le même
  # groupe s'annuleraient mutuellement.
  group: admin-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  admin-security-e2e:
    name: Admin Security E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATA_ENCRYPTION_KEY: "111122223333444455556666777788889999aaaabbbbccccddddeeeeffff0000"
      DATA_LOOKUP_HMAC_KEY: "0000ffffeeeeccccbbbbaaaa9999888877776666555544443333222211110000"
      ADMIN_SESSION_SECRET: "ceci_est_un_secret_de_test_pour_la_ci_github_uniquement_32_chars"
      SESSION_JWT_SECRET: "ci_test_session_secret_for_admin_e2e_checks_only_1234567890"
      ADMIN_PASSWORD: "ci-admin-password"
      ADMIN_BACKEND_EMAIL: "ci-admin@bolo237.test"
      ADMIN_BACKEND_PASSWORD: "ci-backend-password"
      NEXT_PUBLIC_API_URL: "http://127.0.0.1:5001"
      JOB_SCRAPER_ENABLED: "false"

    defaults:
      run:
        working-directory: ./admin-Bolo237

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: './admin-Bolo237/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Run admin E2E tests (Chromium)
        run: ./node_modules/.bin/playwright test tests/admin-uploads-proxy.spec.ts tests/admin-inbox-attachments.spec.ts tests/admin-core.spec.ts --project=chromium --reporter=line

  admin-docker:
    name: Admin Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # hadolint valide le Dockerfile sans le construire : quelques secondes,
      # et il attrape les mauvaises pratiques avant le build coûteux.
      - name: Lint du Dockerfile
        uses: hadolint/hadolint-action@2a66e89f53d0771bb131a7fa31f3136336094aa6
        with:
          dockerfile: admin-Bolo237/Dockerfile

      # L'image n'est déployée nulle part aujourd'hui — Render et Vercel
      # construisent autrement. Ce job vérifie qu'elle se construit malgré
      # tout, faute de quoi un Dockerfile cassé dormirait des mois.
      - name: Build de l'image
        run: docker build -t bolo237-admin:ci ./admin-Bolo237