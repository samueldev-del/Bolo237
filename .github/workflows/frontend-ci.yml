name: Frontend Core E2E CI

on:
  workflow_dispatch:
  # Pas de filtre de chemins : un check requis qui ne s'exécute pas ne
  # reporte jamais de statut, et la pull request reste bloquée sans cause
  # visible. Les minutes Actions sont illimitées sur un dépôt public, et
  # les trois workflows tournent en parallèle en moins de trois minutes.
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend-core-e2e:
    name: Frontend Core E2E
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Run frontend core E2E tests
        run: ./node_modules/.bin/playwright test tests/candidate.spec.ts tests/company.spec.ts tests/artisan.spec.ts --project=chromium --workers=3 --reporter=line